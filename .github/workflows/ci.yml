name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Os testes de UI que precisam do backend se ignoram sozinhos quando ele não está no ar.
      - run: ./gradlew :shared:jvmTest :desktopApp:compileKotlin :webApp:compileKotlinWasmJs :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: shared/build/reports/tests/
