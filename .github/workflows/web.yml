name: Publicar Web

# Publica a versão Web (Wasm) no GitHub Pages apontando para a API de produção.
# Requer: Settings › Pages › Source = GitHub Actions, e a variável de repositório API_URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :webApp:wasmJsBrowserDistribution -Pwatchjobs.apiUrl=${{ vars.API_URL }} --no-daemon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable
  deploy:
    needs: build
    if: ${{ github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
